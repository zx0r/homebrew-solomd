name: Homebrew CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  audit:
    name: "🍺 Audit & Style Check"
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: "⚙️ Setup Homebrew"
        uses: Homebrew/actions/setup-homebrew@master
        with:
          test-bot: false

      - name: "🛒 Checkout Code"
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: "📏 Style Check"
        run: |
          brew style Casks/solomd.rb

      - name: "🔍 Audit Cask"
        run: |
          # Tap the local repository path
          brew tap "${GITHUB_REPOSITORY}" "${GITHUB_WORKSPACE}"
          brew audit --cask --online "${GITHUB_REPOSITORY}/solomd"
